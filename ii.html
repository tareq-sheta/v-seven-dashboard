<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Bar Expand Right</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f0f0f0;
        font-family: sans-serif;
      }

      .search-container {
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        position: relative;
        left: 0; /* Needed so it can animate from 0 → 100px */
      }

      .search-container:has(:focus) {
        background-color: aqua;
        left: 100px;
      }

      .search-button {
        height: 40px;
        width: 40px;
        border: none;
        background-color: #007bff;
        color: white;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        flex-shrink: 0;
      }

      .search-input {
        width: 0;
        opacity: 0;
        padding: 0 1em;
        margin-left: 10px;
        height: 40px;
        border: 1px solid #ccc;
        border-radius: 20px;
        font-size: 1rem;
        outline: none;
        transition: width 0.3s ease, opacity 0.3s ease;
        overflow: hidden;
      }

      .search-container:focus-within .search-input {
        width: 200px;
        opacity: 1;
      }

      @media (max-width: 600px) {
        .search-container:focus-within .search-input {
          width: 150px;
        }
      }
    </style>
  </head>
  <body>
    <div class="search-container">
      <button class="search-button">🔍</button>
      <input type="text" class="search-input" placeholder="Search..." />
    </div>
  </body>
</html>
